<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de facturación</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- Antes de app.css: app.css sobreescribe las variables --mud-palette-* de MudBlazor
         con las nuestras (mudblazor-tema.css), y el orden de la cascada es lo que decide
         quién gana cuando dos reglas tienen la misma especificidad. -->
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <!-- El SDK llena este importmap con los nombres huellados del runtime. Es el único
         script en línea que queda, y el servidor le calcula su hash para la CSP al
         arrancar; ver PoliticaDeContenido. No agregues más scripts en línea aquí. -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="tema.js"></script>
    <script src="portapapeles.js"></script>
    <script src="instalacion.js"></script>
    <script src="registrar-sw.js"></script>
</body>

</html>
